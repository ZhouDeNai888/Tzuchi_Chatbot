  #     - app_network
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]


# cpu version
  ollama:
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    volumes:
      - .:/code
      - ./ollama/ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: always
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
  public_network:
    driver: bridge

  # nextjs_network:
  #   driver: bridge
  #   external: true

volumes:
  ai_server_data:
  qdrant_data:
